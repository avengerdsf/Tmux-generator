<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tmux session 编排器</title>
  <style>
    *{box-sizing:border-box}body{--bg:#0f172a;--card:#111827;--panel:#020617;--line:#334155;--line2:#475569;--text:#e5e7eb;--muted:#94a3b8;--soft:#1e293b;--ok:#bbf7d0;--option-active:#1e293b;--pane-bg:#1e3a8a;--pane-border:#38bdf8;--pane-text:#e5e7eb;--pane-meta:#cbd5e1;margin:0;background:var(--bg);color:var(--text);font-family:system-ui}body.light{--bg:#f3f4f6;--card:#ffffff;--panel:#f8fafc;--line:#cbd5e1;--line2:#94a3b8;--text:#111827;--muted:#64748b;--soft:#e2e8f0;--ok:#166534;--option-active:#dbeafe;--pane-bg:#eff6ff;--pane-border:#93c5fd;--pane-text:#1e3a8a;--pane-meta:#475569}.app{display:grid;grid-template-columns:350px 1fr 430px;gap:14px;height:100vh;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:14px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:16px}.head p{margin:6px 0 0;color:var(--muted);font-size:12px}.body{height:calc(100% - 66px);overflow:auto;padding:14px}label{display:block;margin:12px 0 6px;color:var(--muted);font-size:12px}input,textarea{width:100%;min-height:38px;padding:10px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;font-size:13px;outline:none}textarea{min-height:84px}.native-select{display:none}.select-shell{position:relative}.fake-select{width:100%;min-height:38px;padding:10px 34px 10px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;font-size:13px;text-align:left;position:relative}.fake-select:after{content:"";position:absolute;right:13px;top:15px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--muted)}.select-menu{position:absolute;z-index:20;left:0;right:0;top:42px;padding:4px;border:1px solid var(--line2);border-radius:10px;background:var(--card);box-shadow:0 14px 36px rgba(0,0,0,.28)}.select-option{padding:9px 10px;border-radius:8px;color:var(--text);cursor:pointer;font-size:13px}.select-option:hover,.select-option.active{background:var(--option-active);color:var(--text);font-weight:600}.theme-row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;margin-top:12px}.theme-row label{margin:0}.row,.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.grid4 button{padding:0 6px;font-size:13px}button{width:100%;min-height:38px;border:1px solid var(--line2);border-radius:10px;background:var(--soft);color:var(--text);cursor:pointer;transition:120ms ease;white-space:nowrap}.settings-btn{position:fixed;right:18px;top:18px;z-index:12;width:40px;height:40px;min-height:40px;border-radius:50%;font-size:18px}.primary{background:#2563eb;color:white}.green{background:#166534;color:white}.danger{background:#7f1d1d;color:white}.warn{background:#92400e;color:white}.workspace{height:calc(100% - 90px);min-height:420px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}.node{height:100%;min-width:80px;min-height:70px}.split{display:flex;gap:8px;width:100%;height:100%;padding:4px}.column{flex-direction:column}.pane{height:100%;min-height:78px;border:1px solid var(--pane-border);border-radius:10px;padding:10px;background:var(--pane-bg);color:var(--pane-text);cursor:pointer;overflow:hidden}.pane-title{display:flex;align-items:center;gap:7px;font-weight:700}.pane-order{min-width:28px;height:22px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--panel);border:1px solid var(--pane-border);color:var(--pane-text)}.selected{outline:3px solid #60a5fa}.meta{font-size:11px;color:var(--pane-meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip,.entry{display:inline-block;padding:7px 10px;border:1px solid var(--line2);border-radius:999px;margin:4px;color:var(--muted);cursor:pointer}.tab{display:inline-flex;align-items:center;justify-content:center;min-width:86px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;margin:0 7px 10px 0;color:var(--muted);cursor:pointer;font-size:12px}.active{background:#2563eb;color:white}pre{white-space:pre-wrap;overflow:auto;overflow-wrap:anywhere;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:220px}.hidden{display:none}.status,.hint{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ok);font-size:12px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020617cc;padding:20px}.modal.show{display:flex}.dialog{width:min(680px,96vw);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px}.settings-form,.export-form{display:grid;gap:12px}.settings-form label{margin-top:0}.settings-actions,.export-actions{margin-top:12px}.export-preview{min-height:112px;margin-top:0}.dir-panel{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}.dir-panel-head{height:38px;display:grid;grid-template-columns:1fr 44px;align-items:center;border-bottom:1px solid var(--line)}.dir-title{padding:0 11px;color:var(--muted);font-size:12px}.dir-refresh{height:38px;min-height:38px;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--soft);font-size:18px;line-height:1}.dir-refresh:active,.dir-refresh.loading{background:#2563eb;color:white}.dir-refresh.loading{transform:rotate(180deg)}.list{max-height:180px;overflow:auto;margin-top:0;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.45) transparent}.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-track{background:transparent}.list::-webkit-scrollbar-thumb{background:rgba(148,163,184,.36);border-radius:999px;border:2px solid transparent;background-clip:content-box}.list::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.58);background-clip:content-box}.entry{display:flex;border-radius:0;margin:0;justify-content:space-between;width:100%;padding:9px 10px;border:0;border-bottom:1px solid var(--line);color:var(--text)}.entry:last-child{border-bottom:0}.entry:hover{background:var(--soft);color:var(--text)}@media(max-width:1200px){.app{grid-template-columns:1fr;height:auto}.card{min-height:480px}.grid4{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<button class="settings-btn" id="settingsBtn" title="设置" aria-label="设置">⚙</button>
<div class="app">
  <section class="card"><div class="head"><h2>配置面板</h2></div><div class="body">
    <label>Session 名称</label><input id="sessionName" value="robot_debug">
    <label>Window</label><div id="windowList"></div><div class="btns"><button class="primary" id="addWindowBtn">添加 window</button><button class="danger" id="deleteWindowBtn">删除当前 window</button></div>
    <div class="row"><div><label>选中 Pane ID</label><input id="paneId" disabled></div><div><label>标题</label><input id="paneTitle"></div></div>
    <label>启动命令 command</label><textarea id="paneCommand"></textarea>
    <div class="grid4"><button class="primary" id="splitLRBtn">左右分割</button><button class="primary" id="splitUDBtn">上下分割</button><button class="warn" id="duplicateBtn">复制 pane</button><button class="danger" id="deletePaneBtn">删除 pane</button></div>
    <div class="status hidden" id="statusBox"></div>
  </div></section>
  <section class="card"><div class="head"><h2>布局编辑区</h2></div><div class="body">
    <div class="btns"><button class="green" id="tmuxToggleBtn">启动 tmux session</button><button class="primary" id="exportBtn">导出到服务器</button></div><div class="workspace" id="workspace"></div>
  </div></section>
  <section class="card"><div class="head"><h2>生成结果</h2></div><div class="body">
    <div><span class="tab active" data-tab="yaml">YAML</span><span class="tab" data-tab="script">sh 脚本</span></div>
    <pre id="yamlOut"></pre><pre id="scriptOut" class="hidden"></pre><div class="hint" id="serverInfo"></div>
  </div></section>
</div>
<div class="modal" id="exportModal"><div class="dialog">
  <h3>导出配置</h3><div class="export-form"><div class="row"><div><label>导出类型</label><div class="select-shell"><select class="native-select" id="exportKindSelect"><option value="yaml">YAML</option><option value="sh">sh</option><option value="both">both</option></select></div></div><div><label>短命令</label><div class="select-shell"><select class="native-select" id="quickCommandMode"><option value="off">关闭</option><option value="on">开启</option></select></div></div></div>
  <div><label>导出目录</label><input id="exportDir" value="/home/chen/code/my_robot/robot_rl_mjlab/tmux_exports"></div>
  <div class="dir-panel"><div class="dir-panel-head"><div class="dir-title">目录预览</div><button class="dir-refresh" id="refreshDirBtn" title="刷新目录">↻</button></div><div class="list" id="exportDirList"></div></div><pre class="export-preview" id="exportTargetPreview">导出目标：</pre>
  <div class="btns export-actions"><button id="cancelExportBtn">取消</button><button class="green" id="confirmExportBtn">确认导出</button></div></div>
</div></div>
<div class="modal" id="settingsModal"><div class="dialog">
  <h3>设置</h3><div class="settings-form">
    <div><label>主题</label><div class="select-shell"><select class="native-select" id="themeSelect"><option value="auto">跟随浏览器</option><option value="dark">深色模式</option><option value="light">浅色模式</option></select></div></div>
    <div><label>自启动</label><div class="select-shell"><select class="native-select" id="autoStartSelect"><option value="off">关闭</option><option value="on">开启</option></select></div></div>
    <div class="btns settings-actions"><button id="cancelSettingsBtn">取消</button><button class="green" id="saveSettingsBtn">保存</button></div>
  </div>
</div></div>
<script>
const defaultExportDir="/home/chen/code/my_robot/robot_rl_mjlab/tmux_exports";
let paneCounter=3,windowCounter=1,selectedPaneId="pane-1",activeWindowId="window-1",cacheReady=false,saveTimer=null,tmuxRunning=false,lastExportDir=localStorage.getItem("tmux-generator-export-dir")||defaultExportDir,lastExportKind=localStorage.getItem("tmux-generator-export-kind")||"yaml",lastQuickCommandMode=localStorage.getItem("tmux-generator-quick-mode")||"off";
const state={session:"robot_debug",windows:[{id:"window-1",name:"main",layout:{type:"split",direction:"row",ratio:50,children:[{type:"pane",id:"pane-1",title:"train",command:"python scripts/train.py"},{type:"pane",id:"pane-2",title:"gpu",command:"nvidia-smi -l 1"}]}}]};
const $=id=>document.getElementById(id); const api=(url,opt={})=>fetch(url,{headers:{"Content-Type":"application/json"},...opt});
function applyTheme(mode){const prefers=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches;document.body.classList.toggle("light",mode==="light"||(mode==="auto"&&prefers));$("themeSelect").value=mode;syncFakeSelect($("themeSelect"))}
function setupFakeSelect(select){const shell=select.parentElement,btn=document.createElement("button"),menu=document.createElement("div");btn.type="button";btn.className="fake-select";menu.className="select-menu hidden";shell.appendChild(btn);shell.appendChild(menu);function draw(){btn.textContent=select.options[select.selectedIndex].text;menu.innerHTML="";Array.from(select.options).forEach(option=>{const item=document.createElement("div");item.className="select-option"+(option.value===select.value?" active":"");item.textContent=option.text;item.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event("change"));menu.classList.add("hidden");draw()};menu.appendChild(item)})}btn.onclick=event=>{event.stopPropagation();document.querySelectorAll(".select-menu").forEach(x=>{if(x!==menu)x.classList.add("hidden")});menu.classList.toggle("hidden")};select._drawFake=draw;draw()}
function syncFakeSelect(select){if(select&&select._drawFake)select._drawFake()}
document.addEventListener("click",()=>document.querySelectorAll(".select-menu").forEach(x=>x.classList.add("hidden")));
function flash(t){$("statusBox").textContent=t;$("statusBox").classList.remove("hidden")}
function saveConfig(){if(!cacheReady)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>api("/api/config",{method:"POST",body:JSON.stringify({config:state,preferences:{exportDir:lastExportDir,exportKind:lastExportKind,quickMode:lastQuickCommandMode,theme:$("themeSelect").value,autoStart:$("autoStartSelect").value}})}),250)}
function pane(id,title,command){return{type:"pane",id,title,command}} function clone(o){return JSON.parse(JSON.stringify(o))}
function activeWindow(){return state.windows.find(w=>w.id===activeWindowId)||state.windows[0]}
function findPane(n,id){if(!n)return null;if(n.type==="pane"&&n.id===id)return n;if(n.type==="split")for(const c of n.children){const r=findPane(c,id);if(r)return r}return null}
function replaceNode(n,id,r){if(n.type==="pane"&&n.id===id)return r;if(n.type==="split")n.children=n.children.map(c=>replaceNode(c,id,r));return n}
function removePane(n,id){if(n.type==="pane")return n.id===id?null:n;const a=n.children.map(c=>removePane(c,id)).filter(Boolean);if(a.length===1)return a[0];n.children=a;return n}
function collect(n,a=[]){if(n.type==="pane")a.push(n);if(n.type==="split")n.children.forEach(c=>collect(c,a));return a}
function collectRects(n,r,a=[]){if(n.type==="pane"){a.push({id:n.id,x:r.x,y:r.y,w:r.w,h:r.h});return a}const c=n.children||[],count=c.length||1;c.forEach((child,i)=>{if(n.direction==="row")collectRects(child,{x:r.x+r.w*i/count,y:r.y,w:r.w/count,h:r.h},a);else collectRects(child,{x:r.x,y:r.y+r.h*i/count,w:r.w,h:r.h/count},a)});return a}
function orderMap(win=activeWindow()){const m=new Map();collectRects(win.layout,{x:0,y:0,w:1,h:1}).sort((a,b)=>Math.abs(a.x-b.x)>1e-6?a.x-b.x:Math.abs(a.y-b.y)>1e-6?a.y-b.y:a.id.localeCompare(b.id)).forEach((p,i)=>m.set(p.id,i+1));return m}
function orderLabel(n){return String(n||0).padStart(2,"0")}
function splitSelected(dir){const w=activeWindow(),s=findPane(w.layout,selectedPaneId);paneCounter++;const np=pane("pane-"+paneCounter,(s?.title||"pane")+" copy",s?.command||"");w.layout=replaceNode(w.layout,selectedPaneId,{type:"split",direction:dir,ratio:50,children:[clone(s),np]});selectedPaneId=np.id;render()}
function renderNode(n,orders=orderMap()){if(n.type==="pane"){const e=document.createElement("div");e.className="pane"+(n.id===selectedPaneId?" selected":"");e.onclick=()=>{selectedPaneId=n.id;render()};e.innerHTML=`<div class=pane-title><span class=pane-order>${orderLabel(orders.get(n.id))}</span><span>${n.title||n.id}</span></div><div class=meta>cmd: ${n.command||"-"}</div>`;return e}const e=document.createElement("div");e.className="split "+n.direction;n.children.forEach(c=>{const w=document.createElement("div");w.className="node";w.style.flex="1";w.appendChild(renderNode(c,orders));e.appendChild(w)});return e}
async function refreshPreview(){const r=await api("/api/preview",{method:"POST",body:JSON.stringify({config:state,directory:$("exportDir").value,quick:quick()})});const j=await r.json();$("yamlOut").textContent=j.yaml;$("scriptOut").textContent=j.script}
function render(){state.session=$("sessionName").value||"robot_debug";$("windowList").innerHTML="";state.windows.forEach(w=>{const c=document.createElement("span");c.className="chip"+(w.id===activeWindowId?" active":"");c.textContent=w.name;c.onclick=()=>{activeWindowId=w.id;selectedPaneId=collect(w.layout)[0].id;render()};$("windowList").appendChild(c)});$("workspace").innerHTML="";$("workspace").appendChild(renderNode(activeWindow().layout));const s=findPane(activeWindow().layout,selectedPaneId);$("paneId").value=s?.id||"";$("paneTitle").value=s?.title||"";$("paneCommand").value=s?.command||"";refreshPreview();saveConfig()}
function sanitizeName(v){const x=String(v||"").trim().replace(/[^A-Za-z0-9_-]/g,"_").replace(/^_+/,"");return x||"tmux_session"} function quick(){const start=sanitizeName(state.session);return{enabled:$("quickCommandMode").value==="on",start,stop:"kill-"+start}}
async function listDir(){const refresh=$("refreshDirBtn");if(refresh)refresh.classList.add("loading");try{const p=$("exportDir").value||"/";const r=await fetch("/api/fs/list?path="+encodeURIComponent(p));const j=await r.json();$("exportDir").value=j.path||p;lastExportDir=$("exportDir").value;$("exportDirList").innerHTML="";if(j.parent&&j.parent!==j.path){const up=document.createElement("div");up.className="entry";up.innerHTML="<span>..</span><span>上一级</span>";up.onclick=()=>{$("exportDir").value=j.parent;lastExportDir=j.parent;listDir();previewTarget()};$("exportDirList").appendChild(up)}(j.entries||[]).forEach(x=>{const e=document.createElement("div");e.className="entry";e.innerHTML=`<span>${x.name}</span><span>进入</span>`;e.onclick=()=>{$("exportDir").value=$("exportDir").value.replace(/\/$/,"")+"/"+x.name;lastExportDir=$("exportDir").value;listDir();previewTarget()};$("exportDirList").appendChild(e)});if(!(j.entries||[]).length){const empty=document.createElement("div");empty.className="entry";empty.innerHTML="<span>当前目录无子目录</span><span>可直接选择</span>";$("exportDirList").appendChild(empty)}previewTarget()}finally{if(refresh)setTimeout(()=>refresh.classList.remove("loading"),160)}}
function previewTarget(){const d=$("exportDir").value,k=$("exportKindSelect").value,b=state.session||"tmux_session",q=quick();let f=k==="both"?[b+".yaml",b+".sh"]:[b+"."+k];let text="导出目标：\n"+f.map(x=>"  "+d+"/"+x).join("\n");if(q.enabled)text+="\n启动短命令："+q.start+"\n关闭短命令："+q.stop+"\n删除短命令：del-"+q.start;$("exportTargetPreview").textContent=text}
["paneTitle","paneCommand"].forEach(id=>$(id).oninput=()=>{const s=findPane(activeWindow().layout,selectedPaneId);s.title=$("paneTitle").value;s.command=$("paneCommand").value;render()});
$("sessionName").oninput=render;$("splitLRBtn").onclick=()=>splitSelected("row");$("splitUDBtn").onclick=()=>splitSelected("column");$("duplicateBtn").onclick=()=>splitSelected("row");$("deletePaneBtn").onclick=()=>{if(collect(activeWindow().layout).length<=1)return flash("至少保留一个 pane");activeWindow().layout=removePane(activeWindow().layout,selectedPaneId);selectedPaneId=collect(activeWindow().layout)[0].id;render()};
$("addWindowBtn").onclick=()=>{windowCounter++;paneCounter++;const w={id:"window-"+windowCounter,name:"window-"+windowCounter,layout:pane("pane-"+paneCounter,"new task","")};state.windows.push(w);activeWindowId=w.id;selectedPaneId=w.layout.id;render()};$("deleteWindowBtn").onclick=()=>{if(state.windows.length<=1)return flash("至少保留一个 window");state.windows=state.windows.filter(w=>w.id!==activeWindowId);activeWindowId=state.windows[0].id;selectedPaneId=collect(state.windows[0].layout)[0].id;render()};
$("exportBtn").onclick=()=>{$("exportKindSelect").value=lastExportKind;$("exportDir").value=lastExportDir;$("quickCommandMode").value=lastQuickCommandMode;syncFakeSelect($("exportKindSelect"));syncFakeSelect($("quickCommandMode"));$("exportModal").classList.add("show");listDir();previewTarget()};$("cancelExportBtn").onclick=()=>$("exportModal").classList.remove("show");$("exportKindSelect").onchange=()=>{lastExportKind=$("exportKindSelect").value;localStorage.setItem("tmux-generator-export-kind",lastExportKind);previewTarget()};$("exportDir").oninput=()=>{lastExportDir=$("exportDir").value;localStorage.setItem("tmux-generator-export-dir",lastExportDir);listDir();previewTarget()};$("quickCommandMode").onchange=()=>{lastQuickCommandMode=$("quickCommandMode").value;localStorage.setItem("tmux-generator-quick-mode",lastQuickCommandMode);previewTarget();refreshPreview()};
$("refreshDirBtn").onclick=listDir;
$("themeSelect").onchange=()=>applyTheme($("themeSelect").value);
$("settingsBtn").onclick=()=>{$("themeSelect").value=localStorage.getItem("tmux-generator-theme")||"auto";$("autoStartSelect").value=localStorage.getItem("tmux-generator-autostart")||"off";syncFakeSelect($("themeSelect"));syncFakeSelect($("autoStartSelect"));$("settingsModal").classList.add("show")};$("cancelSettingsBtn").onclick=()=>{$("settingsModal").classList.remove("show");applyTheme(localStorage.getItem("tmux-generator-theme")||"auto")};$("saveSettingsBtn").onclick=()=>{localStorage.setItem("tmux-generator-theme",$("themeSelect").value);localStorage.setItem("tmux-generator-autostart",$("autoStartSelect").value);applyTheme($("themeSelect").value);$("settingsModal").classList.remove("show");saveConfig();if($("autoStartSelect").value==="on")launchSession("自启动返回码: ")};
$("confirmExportBtn").onclick=async()=>{lastExportKind=$("exportKindSelect").value;lastExportDir=$("exportDir").value;lastQuickCommandMode=$("quickCommandMode").value;localStorage.setItem("tmux-generator-export-kind",lastExportKind);localStorage.setItem("tmux-generator-export-dir",lastExportDir);localStorage.setItem("tmux-generator-quick-mode",lastQuickCommandMode);saveConfig();const r=await api("/api/export",{method:"POST",body:JSON.stringify({config:state,kind:lastExportKind,directory:lastExportDir,quick:quick()})});const j=await r.json();flash("已导出: "+(j.files||[]).join(", ")+(quick().enabled?"，启动短命令: "+quick().start+"，关闭短命令: "+quick().stop+"，删除短命令: del-"+quick().start:""));$("exportModal").classList.remove("show")};
function syncTmuxButton(){const btn=$("tmuxToggleBtn");btn.textContent=tmuxRunning?"关闭 tmux session":"启动 tmux session";btn.classList.toggle("green",!tmuxRunning);btn.classList.toggle("danger",tmuxRunning)}
async function launchSession(label="启动返回码: "){const r=await api("/api/tmux/start",{method:"POST",body:JSON.stringify({config:state})});const j=await r.json();tmuxRunning=j.returncode===0;syncTmuxButton();flash(label+j.returncode)}
async function stopSession(label="关闭返回码: "){const r=await api("/api/tmux/stop",{method:"POST",body:JSON.stringify({config:state})});const j=await r.json();tmuxRunning=false;syncTmuxButton();flash(label+j.returncode)}
$("tmuxToggleBtn").onclick=()=>tmuxRunning?stopSession():launchSession();
function selectPreviewTab(tab,remember=true){if(tab!=="script")tab="yaml";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));$("yamlOut").classList.toggle("hidden",tab!=="yaml");$("scriptOut").classList.toggle("hidden",tab!=="script");if(remember)localStorage.setItem("tmux-generator-preview-tab",tab)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>selectPreviewTab(t.dataset.tab));
$("serverInfo").textContent="广播发现: UDP 48765 发送 TMUX_GENERATOR_DISCOVER";
document.querySelectorAll(".native-select").forEach(setupFakeSelect);
async function loadServerCache(){try{const r=await api("/api/config");const j=await r.json();if(j.config&&j.config.windows){state.session=j.config.session||state.session;state.windows=j.config.windows;activeWindowId=state.windows[0]?.id||activeWindowId;const panes=state.windows.flatMap(w=>collect(w.layout,[]));selectedPaneId=panes[0]?.id||selectedPaneId;paneCounter=Math.max(paneCounter,...panes.map(p=>Number(String(p.id).replace("pane-",""))||0));windowCounter=Math.max(windowCounter,...state.windows.map(w=>Number(String(w.id).replace("window-",""))||0));const p=j.preferences||{};lastExportDir=p.exportDir||lastExportDir;lastExportKind=p.exportKind||lastExportKind;lastQuickCommandMode=p.quickMode||lastQuickCommandMode;if(p.theme)localStorage.setItem("tmux-generator-theme",p.theme);if(p.autoStart)localStorage.setItem("tmux-generator-autostart",p.autoStart)}}finally{cacheReady=true}}
function loadPreferences(){$("sessionName").value=state.session;$("exportDir").value=lastExportDir;$("exportKindSelect").value=lastExportKind;$("quickCommandMode").value=lastQuickCommandMode;$("autoStartSelect").value=localStorage.getItem("tmux-generator-autostart")||"off";applyTheme(localStorage.getItem("tmux-generator-theme")||"auto");syncFakeSelect($("exportKindSelect"));syncFakeSelect($("quickCommandMode"));syncFakeSelect($("autoStartSelect"))}
function autoStartIfEnabled(){if(localStorage.getItem("tmux-generator-autostart")==="on")launchSession("自启动返回码: ")}
async function boot(){await loadServerCache();loadPreferences();syncTmuxButton();render();selectPreviewTab(localStorage.getItem("tmux-generator-preview-tab")||"yaml",false);autoStartIfEnabled()}
boot();
if(window.matchMedia)window.matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if($("themeSelect").value==="auto")applyTheme("auto")});
</script></body></html>
