[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-generator"
version = "1.5.0"
description = "Web backend for generating and launching tmux scripts"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn"]

[project.scripts]
tmux-generator = "tmux_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmux_generator = ["static/*"]
